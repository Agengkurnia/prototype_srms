<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Characteristics Setup | Slope Risk Management System</title>
    <link rel="icon" type="image/svg+xml" href="components/icons/icon-lhms.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-100 font-sans antialiased text-gray-900 pb-28" x-data="charHandler()" x-init="init()">

    <!-- Header Navigation -->
    <nav class="relative z-40 w-full bg-white shadow-sm border-b border-gray-100">
        <div class="flex justify-between items-center mx-auto py-3.5 px-6 max-w-7xl">
            <div class="flex items-center">
                <img src="components/icons/icon-srms.svg" class="w-8 mr-2.5" alt="Logo">
                <p class="font-black text-sm uppercase leading-tight tracking-wider text-gray-800">
                    Slope Risk<br><span class="text-lime-600">Management System</span>
                </p>
            </div>
            <a href="inventory.html" class="text-sm font-bold text-gray-500 hover:text-gray-700">Cancel & Exit</a>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="max-w-4xl mx-auto px-6 py-6" x-show="!loading">
        <!-- Breadcrumb row -->
        <div class="flex justify-between items-center mb-6 py-3 px-6 bg-white border border-gray-200 shadow-sm rounded-2xl">
            <span class="text-sm font-semibold text-gray-600">Create New Slope Parameters</span>
            <span class="text-xs bg-lime-100 text-lime-800 font-bold px-2.5 py-0.5 rounded-full uppercase" x-text="slope.slope_type"></span>
        </div>

        <!-- Wizard Step Indicator -->
        <div class="bg-white border border-gray-200 shadow-sm rounded-3xl p-6 mb-6">
            <div class="flex items-center justify-between max-w-lg mx-auto">
                <div class="flex flex-col items-center">
                    <span class="w-8 h-8 rounded-full bg-lime-100 text-lime-800 flex items-center justify-center font-bold text-sm">1</span>
                    <span class="text-xs font-semibold text-lime-700 mt-2">Geometry</span>
                </div>
                <div class="h-0.5 bg-lime-600 flex-1 mx-4"></div>
                <div class="flex flex-col items-center">
                    <span class="w-8 h-8 rounded-full bg-lime-600 text-white flex items-center justify-center font-bold text-sm">2</span>
                    <span class="text-xs font-bold text-lime-600 mt-2">Characteristics</span>
                </div>
                <div class="h-0.5 bg-gray-200 flex-1 mx-4"></div>
                <div class="flex flex-col items-center">
                    <span class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm">3</span>
                    <span class="text-xs font-semibold text-gray-400 mt-2">Rating</span>
                </div>
            </div>
        </div>

        <form @submit.prevent="submitForm()" class="space-y-6">
            <!-- Form Card Wrapper -->
            <div class="bg-white border border-gray-200 shadow-sm rounded-3xl p-8 space-y-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800" x-text="'Visual Characteristics - ' + slope.slope_name"></h2>
                    <p class="text-gray-500 text-sm mt-1">Please enter qualitative geological observations. These values will assist engineers during field inspections.</p>
                </div>
                
                <div class="border-t border-gray-100"></div>

                <!-- Input Fields Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    
                    <!-- Slope Protection Type -->
                    <div>
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Slope Protection Measure</label>
                        <select x-model="char.slope_protection" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition">
                            <option value="">-- Select Measure --</option>
                            <option value="Hydroseeding">Hydroseeding</option>
                            <option value="Shotcrete">Shotcrete / Guniting</option>
                            <option value="Soil Nailing">Soil Nailing / Anchor</option>
                            <option value="Rockfall Netting">Rockfall Netting</option>
                            <option value="Geogrid + Turf">Geogrid + Turf</option>
                            <option value="None">No Protection</option>
                        </select>
                    </div>

                    <!-- Surface Drainage Provision -->
                    <div>
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Surface Drainage Provision</label>
                        <select x-model="char.surface_drainage_provision" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition">
                            <option value="">-- Select Provision --</option>
                            <option value="Concrete U-Ditch">Concrete U-Ditch</option>
                            <option value="Catch drain">Catch Drain</option>
                            <option value="Cascade drain">Cascade / Step Drain</option>
                            <option value="None">No Drainage</option>
                        </select>
                    </div>

                    <!-- Hydrogeological Settings -->
                    <div>
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Hydrogeological Settings</label>
                        <select x-model="char.hydrogeological_settings" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition">
                            <option value="">-- Select Hydrology --</option>
                            <option value="Dry">Dry / No Seepage</option>
                            <option value="Damp">Damp / Minor Moisture</option>
                            <option value="Seepage">Active Seepage</option>
                            <option value="Wet">Wet / Standing Water / Spring</option>
                        </select>
                    </div>

                    <!-- Geological Features -->
                    <div>
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Geological Features (Strata/Soil Type)</label>
                        <input type="text" x-model="char.geological_features" placeholder="e.g. Colluvial clay, Sandstone joints" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition">
                    </div>

                    <!-- Signs of Distress -->
                    <div class="sm:col-span-2">
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Signs of Distress / Tension Cracks</label>
                        <textarea rows="3" x-model="char.signs_of_distress" placeholder="e.g. Tension cracks at crest (2-5mm width), minor bulging at toe" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition"></textarea>
                    </div>

                    <!-- Instability Triggered After -->
                    <div class="sm:col-span-2">
                        <label class="block mb-1.5 text-sm font-bold text-gray-700">Instability Triggered After</label>
                        <select x-model="char.instability_after" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-lime-500 focus:border-lime-500 outline-none text-sm transition">
                            <option value="None">None / Stable</option>
                            <option value="Heavy Rain">Heavy Rainstorm</option>
                            <option value="Earthquake">Earthquake Activity</option>
                            <option value="Construction Works">Construction / Excavation Works</option>
                        </select>
                    </div>

                </div>

            </div>

            <!-- Sticky Bottom Buttons Bar -->
            <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-4 flex justify-between items-center shadow-2xl z-40">
                <a :href="'geometry.html?slug=' + slug" class="text-gray-500 hover:text-gray-800 font-bold text-sm">← Back: Geometry</a>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-semibold text-gray-400">Step 2 of 3</span>
                    <button type="submit" class="bg-lime-600 hover:bg-lime-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition shadow-lg hover:shadow-lime-600/30">
                        Save & Next: Scoring →
                    </button>
                </div>
            </div>
        </form>

    </div>

    <!-- Loading Screen -->
    <div class="flex items-center justify-center min-h-[80vh]" x-show="loading">
        <div class="text-center space-y-3">
            <div class="w-12 h-12 border-4 border-lime-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-gray-500 font-semibold text-sm">Loading config parameters...</p>
        </div>
    </div>

    <script>
        function charHandler() {
            return {
                loading: true,
                slug: '',
                slope: {},
                char: {
                    slope_protection: '',
                    surface_drainage_provision: '',
                    hydrogeological_settings: '',
                    geological_features: '',
                    signs_of_distress: '',
                    instability_after: 'None'
                },

                init() {
                    const params = new URLSearchParams(window.location.search);
                    this.slug = params.get('slug') || '';
                    if (!this.slug) {
                        window.location.href = 'inventory.html';
                        return;
                    }
                    this.fetchDetails();
                },

                fetchDetails() {
                    this.loading = true;
                    fetch(`/api/slopes/${this.slug}`)
                        .then(res => res.json())
                        .then(data => {
                            this.slope = data.slope;
                            if (data.slope.characteristic) {
                                this.char = { ...this.char, ...data.slope.characteristic };
                            }
                            this.loading = false;
                        })
                        .catch(err => {
                            console.error('Error fetching details:', err);
                            this.loading = false;
                        });
                },

                submitForm() {
                    fetch(`/api/slopes/${this.slug}/characteristic`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.char)
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = `rating.html?slug=${this.slug}`;
                        }
                    })
                    .catch(err => console.error('Error saving characteristics:', err));
                }
            }
        }
    </script>
</body>
</html>
